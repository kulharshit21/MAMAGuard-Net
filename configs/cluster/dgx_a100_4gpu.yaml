profile: dgx_a100_4gpu
physical_gpus: [1, 5, 6, 7]
num_gpus: 4
minimum_free_mib_per_gpu: 36000
maximum_utilization_percent: 10
stable_samples: 3
poll_seconds: 30
wait_timeout_seconds: 86400
precision: bf16
cpu_workers_per_rank: 8
omp_num_threads: 8
notes: "Physical IDs apply only outside a scheduler; Slurm owns CUDA_VISIBLE_DEVICES."

